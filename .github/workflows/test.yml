on:
  push:
    branches:
      - "main"
  pull_request:
    # all PRs on all branches
  merge_group:
    branches:
      - "main"

concurrency:
  # For PRs, later CI runs preempt previous ones. e.g. a force push on a PR
  # cancels running CI jobs and starts all new ones.
  #
  # For non-PR pushes, concurrency.group needs to be unique for every distinct
  # CI run we want to have happen. Use run_id, which in practice means all
  # non-PR CI runs will be allowed to run without preempting each other.
  group: ${{ github.workflow }}-$${{ github.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - uses: "ikalnytskyi/action-setup-postgres@v6"
            id: postgres
          - name: Checkout
            uses: actions/checkout@v4
          - name: Install Go
            uses: actions/setup-go@v5
            with:
              go-version-file: go.mod
          - name: go mod tidy
            run: go mod tidy -diff
          - name: Run tests
            run: go test -count=1 ./...
            env:
              # We need to use the key=value format in tests because we rely on
              # being able to build upon the main DSN by appending settings to
              # override those that came before them. This does not work with
              # URIs.
              #
              # This is not a typical requirement. Most applications can use
              # either DSN or URI interchangeably.
              DATABASE_URL: "dbname=postgres host=localhost port=5432 user=postgres password=postgres sslmode=disable"
