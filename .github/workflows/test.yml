on:
  push:
    branches:
      - "main"
  pull_request:
    # all PRs on all branches
  merge_group:
    branches:
      - "main"

concurrency:
  # For PRs, later CI runs preempt previous ones. e.g. a force push on a PR
  # cancels running CI jobs and starts all new ones.
  #
  # For non-PR pushes, concurrency.group needs to be unique for every distinct
  # CI run we want to have happen. Use run_id, which in practice means all
  # non-PR CI runs will be allowed to run without preempting each other.
  group: ${{ github.workflow }}-$${{ github.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:

  test:
    runs-on: ubuntu-20.04
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2

      - name: go mod cache restore
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod/cache
            ~/AppData/Local/go-build
          key: |
            ${{ runner.os }}-${{ matrix.goarch }}-${{ matrix.buildflags }}-go-2-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.goarch }}-${{ matrix.buildflags }}-go-2-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-${{ matrix.goarch }}-${{ matrix.buildflags }}-go-2-

      - name: setup env
        if: always()
        run: |
          mkdir -p $HOME/.local
          go env -w GOEXPERIMENT=synctest,cacheprog

      - name: setup postgres
        uses: bmizerany/setup-postgres@v3

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go test
        run: go test -v -count=1 ./...

      - name: staticcheck
        if: always() # This may contain clues to test failures that came before it, so always run it.
        run: go run honnef.co/go/tools/cmd/staticcheck ./...

      - name: go mod cache save
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        # Always run this step, even if the previous steps failed. Failures can
        # happen after successful builds, so save that work.
        if: always()
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod/cache
            ~/AppData/Local/go-build
          key: |
            ${{ runner.os }}-${{ matrix.goarch }}-${{ matrix.buildflags }}-go-2-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
