on:
  workflow_dispatch:
  push:
  pull_request:
    # all PRs on all branches
  merge_group:
    branches:
      - "main"

concurrency:
  # For PRs, later CI runs preempt previous ones. e.g. a force push on a PR
  # cancels running CI jobs and starts all new ones.
  #
  # For non-PR pushes, concurrency.group needs to be unique for every distinct
  # CI run we want to have happen. Use run_id, which in practice means all
  # non-PR CI runs will be allowed to run without preempting each other.
  group: ${{ github.workflow }}-${{ github.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # cmd/todo/list imports encoding/json/v2; until it graduates the
  # toolchain only builds it when this experiment is set.
  GOEXPERIMENT: jsonv2

jobs:

  check:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: go mod tidy
        run: go mod tidy -diff

      - name: gofmt
        run: |
          gofmt -w -s $(git ls-files '*.go')
          git diff --exit-code

      - name: go fix
        run: go fix -diff ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck ./...


  gotest:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: setup postgres
        uses: bmizerany/setup-postgres@v4

      - name: go test
        run: go test -v -count=1 $(go list ./... | grep -v '^blake.io/polite/potest$')

  gorace:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: setup postgres
        uses: bmizerany/setup-postgres@v4

      - name: go test -race
        run: go test -v -race -count=20 $(go list ./... | grep -v '^blake.io/polite/potest$')

  download:
    # Exercises potest.Download for every supported (goos, goarch).
    # The work is the same regardless of the runner's architecture
    # — we just fetch and unpack the JAR, never execute the foreign
    # binaries — so one Linux runner covers the matrix. The tests
    # in potest skip unless CI is truthy, which GitHub Actions sets
    # automatically.
    #
    # potest is a test helper, not a shipped feature, and its tests
    # depend on Maven Central being reachable. We only let a failure
    # here block CI when potest itself changed in this run; otherwise
    # the failure stays a warning so a flaky network can't gate
    # unrelated work.
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: detect potest changes
        id: changed
        run: |
          case "${{ github.event_name }}" in
            pull_request|pull_request_target)
              base='${{ github.event.pull_request.base.sha }}'
              ;;
            push)
              base='${{ github.event.before }}'
              ;;
            merge_group)
              base='${{ github.event.merge_group.base_sha }}'
              ;;
          esac
          if [ -z "${base:-}" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            # New branch / manual run / unknown base. Treat as changed
            # so a real regression here still blocks.
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD -- potest | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: go test
        run: go test -v -count=1 ./potest
        continue-on-error: ${{ steps.changed.outputs.changed != 'true' }}
