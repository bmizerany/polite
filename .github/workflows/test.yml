on:
  push:
    branches:
      - "main"
  pull_request:
    # all PRs on all branches
  merge_group:
    branches:
      - "main"

concurrency:
  # For PRs, later CI runs preempt previous ones. e.g. a force push on a PR
  # cancels running CI jobs and starts all new ones.
  #
  # For non-PR pushes, concurrency.group needs to be unique for every distinct
  # CI run we want to have happen. Use run_id, which in practice means all
  # non-PR CI runs will be allowed to run without preempting each other.
  group: ${{ github.workflow }}-$${{ github.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - name: Install Postgres
            run: |
              # Configure
              #
              # version is the version of the embedded postgres to install.
              # The format must be in <major>.<minor>.<patch> format.
              version="17.2.0"

              set -ueo pipefail

              cd $HOME/.local

              # Download the embedded postgres binaries
              url="https://repo1.maven.org/maven2/io/zonky/test/postgres/embedded-postgres-binaries-linux-amd64/$version/embedded-postgres-binaries-linux-amd64-$version.jar"
              curl -s -o /tmp/pg.jar -L $url
              unzip -p /tmp/pg.jar postgres-linux-x86_64.txz | xz -d | tar xvf - 1>/dev/null

              echo "PGBIN=$HOME/.local/bin" >> $GITHUB_ENV
              echo "PGDATA=$HOME/.local/share/postgres/data" >> $GITHUB_ENV

              echo "Postgres $version binaries installed to $HOME/.local/bin"
              ./bin/postgres --version
          - name: Postgres initdb
            run: |
              initdb -U postgres -D $PGDATA
          - name: Postgres start
            run: |
              pg_ctl -D $PGDATA -l $PGDATA/logfile start
              echo "DATABASE_URL=dbname=postgres user=postgres password=postgres host=/tmp sslmode=disable" >> $GITHUB_ENV
          - name: Checkout
            uses: actions/checkout@v4
          - name: Install Go
            uses: actions/setup-go@v5
            with:
              # TODO(bmizerany): use go.mod once go1.24 toolchain lands: go-version-file: go.mod
              go-version: '1.24.0-rc.1'
          - name: go mod tidy
            run: go mod tidy -diff
          - name: Run tests
            env:
              GOEXPERIMENT: "synctest"
            run: go test -v -count=1 ./...
          - name: Run staticcheck
            env:
              GOEXPERIMENT: "synctest"
            run: go run honnef.co/go/tools/cmd/staticcheck ./...
